<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading FAQ | Trade Learner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="faqs.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">
  <!-- HEADER -->
  <header class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white py-8 shadow-lg">
    <div class="container mx-auto px-6 flex justify-between items-center">
      <h1 class="text-3xl font-extrabold tracking-wide">Trading FAQ for Beginners</h1>
      <button id="langToggle" class="bg-white text-blue-700 font-semibold px-4 py-2 rounded-full shadow hover:bg-gray-100 transition">
        मराठी / English
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container mx-auto px-6 py-10">
    <p class="text-gray-300 text-lg mb-8 text-center max-w-3xl mx-auto">
      🌱 <span class="font-semibold">Let’s Learn Before We Leap —</span> Understand the basics of trading rather than starting blindly.  
      <br>📘 खालील प्रश्न वाचून समजून घ्या आणि नंतरच ट्रेडिंग सुरू करा.
    </p>

    <div id="faqContainer" class="grid md:grid-cols-2 gap-6"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-gray-400 py-6 mt-16">
    <div class="container mx-auto text-center">
      <p class="text-sm">© 2025 Trade Learner | All Rights Reserved</p>
    </div>
  </footer>
</body>
</html>
